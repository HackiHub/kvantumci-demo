apiVersion: apps/v1
kind: Deployment
metadata:
  name: kvantumci-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: kvantumci-demo }
  template:
    metadata:
      labels: { app: kvantumci-demo }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kvantumci-demo
          image: ghcr.io/hackihub/kvantumci-demo@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: DEMO_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kvantumci-demo-external
                  key: api-key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 3000
          livenessProbe:
            tcpSocket:
              port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: kvantumci-demo
spec:
  type: ClusterIP
  selector: { app: kvantumci-demo }
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kvantumci-demo
spec:
  tls:
    - hosts:
        - kvantumci-demo.example.com
      secretName: kvantumci-demo-tls
  rules:
    - host: kvantumci-demo.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kvantumci-demo
                port: { number: 80 }
